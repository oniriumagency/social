# Política de dependencias de Rust (docs/11 §2 y §5). `pnpm check:supply` la aplica.

[graph]
all-features = true

[advisories]
# Avisos de seguridad de RustSec: cualquier vulnerabilidad o crate sin mantenimiento falla.
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
# Licencias compatibles con AGPL-3.0 y Apache-2.0 (D-04).
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
]
confidence-threshold = 0.9
# La lista es una política, no un inventario: no avisar por licencias aún no usadas.
unused-allowed-license = "allow"

[licenses.private]
# Los crates del propio repositorio no se publican; su licencia se fija en F0-T03 (D-04).
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# I-8: las bibliotecas criptográficas solo pueden ser dependencia directa de social-crypto.
# `wrappers` lista quién puede depender directamente de cada una; cualquier otro crate del
# grafo que la importe hace fallar `pnpm check:supply` y el trabajo supply-chain de CI.
# Para otra biblioteca criptográfica, añádela aquí en el mismo PR (aprobación humana, I-15).
# proptest, rand y tempfile son solo de pruebas: generan datos de prueba y archivos
# temporales, nunca material criptográfico del protocolo. const-random-macro (vía ahash
# en h3o) y ahash solo siembran tablas hash contra colisiones, no material del protocolo.
deny = [
  { crate = "ed25519-dalek", wrappers = ["social-crypto"] },
  { crate = "curve25519-dalek", wrappers = ["ed25519-dalek"] },
  { crate = "x25519-dalek", wrappers = ["social-crypto"] },
  { crate = "blake3", wrappers = ["social-crypto"] },
  { crate = "sha2", wrappers = ["social-crypto", "ed25519-dalek"] },
  { crate = "sha3", wrappers = ["social-crypto"] },
  { crate = "hkdf", wrappers = ["social-crypto"] },
  { crate = "hmac", wrappers = ["hkdf"] },
  { crate = "chacha20poly1305", wrappers = ["social-crypto"] },
  { crate = "chacha20", wrappers = ["chacha20poly1305", "proptest"] },
  { crate = "poly1305", wrappers = ["chacha20poly1305"] },
  { crate = "aes-gcm", wrappers = ["social-crypto"] },
  { crate = "rsa", wrappers = ["social-crypto"] },
  { crate = "blind-rsa-signatures", wrappers = ["social-crypto"] },
    { crate = "getrandom", wrappers = ["social-crypto", "rand", "tempfile", "const-random-macro", "ahash"] },
  { crate = "aes", wrappers = ["social-crypto"] },
  { crate = "aes-gcm-siv", wrappers = ["social-crypto"] },
  { crate = "argon2", wrappers = ["social-crypto"] },
  { crate = "pbkdf2", wrappers = ["social-crypto"] },
  { crate = "scrypt", wrappers = ["social-crypto"] },
  { crate = "blake2", wrappers = ["social-crypto"] },
  { crate = "p256", wrappers = ["social-crypto"] },
  { crate = "k256", wrappers = ["social-crypto"] },
  { crate = "secp256k1", wrappers = ["social-crypto"] },
  { crate = "ed25519-zebra", wrappers = ["social-crypto"] },
  { crate = "ed25519-compact", wrappers = ["social-crypto"] },
  # Algoritmos rotos: prohibidos en todo el grafo.
  { crate = "sha1" },
  { crate = "md-5" },
  { crate = "ring" },
  { crate = "aws-lc-rs" },
  { crate = "aws-lc-sys" },
  { crate = "openssl" },
  { crate = "openssl-sys" },
  { crate = "sodiumoxide" },
  { crate = "libsodium-sys" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
