[workspace]
resolver = "3"
members = ["crates/*", "tools/xtask"]
# fuzz/ es un workspace aparte: cargo-fuzz exige nightly.
exclude = ["fuzz"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "allow"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"
print_stdout = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
