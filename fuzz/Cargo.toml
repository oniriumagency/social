# Objetivos de fuzzing (F0-T10, docs/14 §2). Fuera del workspace: cargo-fuzz exige nightly.
# Ejecución: `pnpm fuzz` (todos, 60 s cada uno) o `pnpm fuzz -- <objetivo> <segundos>`.
[package]
name = "social-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
social-core = { path = "../crates/social-core" }

[workspace]
members = ["."]

[[bin]]
name = "json_parse"
path = "fuzz_targets/json_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "event_parse"
path = "fuzz_targets/event_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "event_validate"
path = "fuzz_targets/event_validate.rs"
test = false
doc = false
bench = false
